name: Angel Options Algo

on:
  schedule:
    - cron: "35 3 * * 1-5"   # 09:05 IST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: angel-algo
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Kolkata
      MAX_RUNTIME_MIN: "340"
      ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
      ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
      ANGEL_MPIN: ${{ secrets.ANGEL_MPIN }}
      ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Run algo
        run: python algo.py
      - name: Save journal & log to repo
        if: always()
        run: |
          git config user.name "algo-bot"
          git config user.email "algo-bot@users.noreply.github.com"
          git add trade_journal.csv algo_*.log 2>/dev/null || true
          git commit -m "Journal $(date +%F)" || echo "nothing to commit"
          git push || echo "push failed"
